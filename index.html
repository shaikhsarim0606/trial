<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

 
<body>
    <h2 class="h2">Registration Form</h2>
    
    <div class="form">
        <DIV class="form1">
        <form action="">
            <label for="">User Name:</label>
            <input type="text" placeholder="Enter Your Name" min="3" max="10" class="ff">
            <hr>
            <label for="">Email:</label>
            <input type="email" placeholder="Enter Your Email Account" class="ff">
            <hr>
            <label for="">Password:</label>
            <input type="password" placeholder="Enter your password" class="ff">
            <hr>
            <label for="">Phone Number:</label>
            <input type="tel" placeholder="Enter your contact" class="ff">
            <hr>
            <label for="">Message:</label>
            <textarea name="" id="" cols="30" rows="3" placeholder="leave your message" class="ff"></textarea>
            <hr>
            <button type="submit" id="btn" onclick="validation()">Submit</button>
        </form>
        </DIV>
    </div>
    <script src="js.js"></script>
</body>

</html>
